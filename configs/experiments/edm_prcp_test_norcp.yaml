experiment:
  name: edm_prcp_test
  output_root: runs/
  seed: 42

stages:
  training: true
  generation: true
  evaluation: true

bases:
  model: configs/models/edm_model_base.yaml
  training: configs/training/training_base.yaml
  generation: configs/generation/generation_base.yaml
  sampler: configs/generation/sampler_base.yaml
  evaluation: configs/evaluation/evaluation_base.yaml
  data: configs/datasets/norcp.yaml

data:
  target:
    variable: prcp
    transform: log1p
    output_shape: [92, 68]

  conditioning:
    dynamic_variables: [prcp]
    static_variables: [topo] 
    input_shape: [23, 17] # 92/4 = 23, 68/4 = 17

  domain:
    hr_size: [92, 68]
    lr_size: [23, 17]
    large_domain: false

  split:
    train: null
    valid: null
    test: null

  overrides: {}

training:
  run_name: train_edm
  overrides: {}


generation:
  run_name: generate_test_best
  overrides:
    generation_run:
      data:
        split: test

evaluation:
  run_name: evaluate_test_best
  overrides:
    evaluation_run:
      data:
        split: test
        forecast_product_for_spatial: pmm
        forecast_product_for_climatology: pmm
        forecast_product_for_temporal: pmm