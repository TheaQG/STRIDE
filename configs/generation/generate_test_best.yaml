generation_run:
  run_name: "generate_test_best"
  output_dir: "runs/train_edm_small/generation/test_best"

  configs:
    dataset_config: "configs/datasets/danra_era5_small.yaml"
    model_config: "configs/models/edm_small.yaml"
    generation_config: "configs/generation/edm_default.yaml"
    training_config: "configs/training/train_edm_small.yaml"

  checkpoint:
    mode: "best"   # best | latest | explicit
    path: null

  data:
    split: "test"
    batch_size: 1
    num_workers: 0
    pin_memory: false

  sampling:
    ensemble_size: 20
    use_fixed_seed: false
    base_seed: 42

  outputs:
    save_members: true
    save_pmm: true
    save_ensemble_mean: true
    save_plots: true
    save_physical: true
    output_format: "npz"