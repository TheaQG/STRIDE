generation:

  checkpoint:
    mode: "best"   # best | latest | explicit
    path: null
    use_ema_weights: true

  data:
    split: "test"
    batch_size: 100
    num_workers: 0
    pin_memory: false
    shuffle: false # We want to preserve the order of the test set for evaluation purposes

  sampling:
    ensemble_size: 16
    use_fixed_seed: false
    base_seed: 42

  outputs:
    save_members: true
    save_pmm: true
    save_ensemble_mean: true
    save_plots: false
    save_physical: true
    output_format: "npz" # npz | netcdf (NorCP only; NetCDF writes no NPZ files)
    # NetCDF currently requires all three products, save_physical: true,
    # data.shuffle: false, a fixed grid, and stages.evaluation: false in pipelines.
    storage_mode: "per_member_bundle" # NPZ only; ignored for NetCDF temporal stacks

  limits:
    max_cases: 3         # small smoke-test limit

  device:
    accelerator: "auto" # auto | cpu | cuda
