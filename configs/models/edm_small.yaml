model:
  name: edm_unet

  in_dynamic_channels: 2
  in_static_channels: 2
  out_channels: 1

  spatial:
    target_height: 128
    target_width: 128
    cond_height: 128
    cond_width: 128

  unet:
    model_channels: 64
    channel_mults: [1, 2, 4, 4]
    num_res_blocks: 2
    dropout: 0.0

  attention:
    use_attention: true
    attention_resolutions: [16]
    num_heads: 4

  embeddings:
    sigma_embed_dim: 128
    film_embed_dim: 128
    use_doy_film: false
    use_variable_film: false

  context:
    use_context_encoder: false
    context_in_channels: 0
    context_embed_dim: 128

  rain_gate:
    use_rain_gate: false
    rain_gate_channels: 32

  temporal:
    use_temporal_stack: false
    temporal_steps: 1